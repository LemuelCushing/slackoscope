version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Everything here is a devDependency, so batch them into one PR per week
    # rather than a stream of individual bumps.
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
